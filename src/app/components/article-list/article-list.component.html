<div class="m-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-4 p-1">
  <div
    *ngFor="let article of articles"
    class="flex gap-2 lg:flex flex-col lg:gap-0 justify-between  border p-4 rounded-lg shadow-md bg-white"
    (click)="showArticle(article._id)"

  >
    <div class="lg:flex justify-start gap-1">
      <div class="w-full lg:w-[60%] flex flex-col">
        <p class="text-sm text-grey-500">{{ formatDate(article.createdAt) }}</p>
        <h2 class="text-xl text-grey font-bold mb-2">{{ article.title }}</h2>
        <!-- <p class="text-gray-700 mb-2">{{article.description}}</p> -->
  
      </div>
      <img
        [src]="article.image"
        alt=""
        class="w-full p-2 lg:p-1 h-32 lg:w-[40%] object-fill border shadow-md mb-2 rounded-xl"
      />
    </div>
    <div>
      <div class="flex gap-4 items-center  ">
