<div class="m-auto grid grid-cols-1 md:grid-cols-1 gap-4 p-4">
  <div
    *ngFor="let article of articles"
    class="flex flex-col justify-between  border p-4 rounded-lg shadow-md bg-white"
    (click)="showArticle(article._id)"
  >
    <div class="flex justify-start">
      <div class="w-[60%] flex flex-col">
        <p class="text-sm text-grey-500">{{ formatDate(article.createdAt) }}</p>
        <h2 class="text-xl font-bold mb-2">{{ article.title }}</h2>
        <!-- <p class="text-gray-700 mb-2">{{article.description}}</p> -->
      </div>
      <img
        [src]="article.image"
        alt=""
        class="p-1 h-32 w-[40%] object-contain mb-2 rounded-xl"
      />
    </div>
    <div>
      <span class="flex gap-4 items-center  ">
        <i class="fa-regular fa-thumbs-up fa-xl"><span class="text-sm ml-1">1</span></i>
        <i class="fa-regular fa-thumbs-down fa-xl"></i>
        <i class="fa-regular fa-comment fa-xl"></i>
      </span>
    </div>
  </div>
</div>
